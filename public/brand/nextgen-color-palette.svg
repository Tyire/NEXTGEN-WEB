<svg viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1F4D"/>
      <stop offset="50%" stop-color="#FF6B2C"/>
      <stop offset="100%" stop-color="#FFA70F"/>
    </linearGradient>
  </defs>
  <text x="0" y="24" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="18" fill="#111">NextGen Telecom — Color Palette</text>

  <rect x="0" y="40" width="600" height="36" rx="6" fill="url(#brandGrad)"/>
  <text x="0" y="92" font-family="monospace" font-size="13" fill="#444">Primary brand gradient (icon &amp; "TELECOM" text)</text>

  <rect x="0" y="105" width="130" height="60" rx="6" fill="#FF1F4D"/>
  <text x="0" y="180" font-family="monospace" font-size="13" fill="#444">#FF1F4D</text>
  <text x="0" y="196" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#888">Pink-Red</text>

  <rect x="150" y="105" width="130" height="60" rx="6" fill="#FF6B2C"/>
  <text x="150" y="180" font-family="monospace" font-size="13" fill="#444">#FF6B2C</text>
  <text x="150" y="196" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#888">Orange (mid)</text>

  <rect x="300" y="105" width="130" height="60" rx="6" fill="#FFA70F"/>
  <text x="300" y="180" font-family="monospace" font-size="13" fill="#444">#FFA70F</text>
  <text x="300" y="196" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#888">Amber</text>

  <rect x="450" y="105" width="130" height="60" rx="6" fill="#000000"/>
  <text x="450" y="180" font-family="monospace" font-size="13" fill="#444">#000000</text>
  <text x="450" y="196" font-family="Poppins, Arial, sans-serif" font-size="11" fill="#888">Wordmark Black</text>
</svg>
