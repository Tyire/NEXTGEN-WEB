# NextGen URL-guard maps. Installed to /etc/nginx/conf.d/10-nextgen-maps.conf.
# Standard: ~/.claude/security/url-tightening-standard.md (R1-R11) and findings F4, F5, F17, F18.
# Every variable starts with $ng_ so that NEEP is never affected.

# ---- R11 off switches: set a value to 0 and reload Nginx to turn that guard off.
map "" $ng_guard_query  { default 1; }   # R1 junk query words + F18 WordPress query tricks
map "" $ng_guard_probe  { default 1; }   # R6 / F17 probe paths (WordPress, .env, .git, backups)
map "" $ng_guard_method { default 1; }   # R2 / F5 unusual HTTP methods

# ---- R1: the allowed query words. One known word keeps an address alone.
# Add a real word here if /var/log/nginx/nextgen-junk-query.log shows one.
map $args $ng_has_known_word {
    default 0;
    "~*(^|&)(s|q|query|search|page|sort|order|limit|lang|locale|v|ver|_rsc|ref|source|medium|campaign|text|subject|utm_[^=&]*|_ga[^=&]*|_gl|mc_cid|mc_eid|gclid|gbraid|wbraid|dclid|msclkid|fbclid|ttclid|twclid|li_fat_id|mibextid|igshid|igsh|epik|yclid|_kx)(=|&|$)" 1;
}

# F18: WordPress tricks in the query give a 404 even beside a real word.
# NextGen does not use any of these words itself.
map $args $ng_wp_query_trick {
    default 0;
    "~*(^|&)(author|rest_route|page_id|p|feed|attachment_id|cat|tag|post_type|preview|preview_id|wc-ajax|add-to-cart|wp_customize|xdebug_session_start)(=|&|$)" 1;
}

# 1 = refuse with the real 404 page.
map "$ng_guard_query:$ng_wp_query_trick:$ng_has_known_word:$args" $ng_bad_query {
    default 0;
    "~^1:1:"     1;   # WordPress trick word
    "~^1:0:0:.+" 1;   # only unknown words
}

# ---- R2: static site, so only GET and HEAD are real.
map "$ng_guard_method:$request_method" $ng_bad_method {
    default 1;
    "~^0:"   0;
    "1:GET"  0;
    "1:HEAD" 0;
}

# ---- R3: traversal, null byte, double encoding, overlong address (checked on the raw address).
map $request_uri $ng_bad_uri {
    default 0;
    "~*(%00|\.\./|\.\.\\|%2e%2e|%2e\.|\.%2e|%252e|%255c|%25(2f|5c)|%c0%ae|%c1%9c)" 1;
    "~^.{2049,}" 1;
}

# ---- R6 / R10 counts. The probe log keeps the path only. The junk-query log keeps the
# query too, because the owner must see the unknown WORDS; logrotate keeps 14 days.
log_format ng_probe '$time_iso8601 $remote_addr $request_method "$uri" $status';
log_format ng_junk  '$time_iso8601 $remote_addr "$uri" "$args"';
map $ng_bad_query $ng_log_junk { 1 1; default 0; }

# Staging names are never indexed.
map $host $ng_robots_header {
    default "";
    "~*\.sslip\.io$" "noindex, nofollow";
}
