# Old WordPress addresses on nextgen.ng -> the new site. Installed to /etc/nginx/conf.d/20-nextgen-redirects.conf.
# Source: the live WordPress sitemaps (wp-sitemap-*.xml), read 24 Nov 2026.
# Used at the DNS cut-over. Value: a path or URL = 301 redirect; "410" = gone for good.
# Matches the decoded path ($uri), with or without the trailing slash, any letter case.

map $uri $ng_old_wp {
    default "";

    # Pages that exist again under the same idea.
    "~*^/about/?$"                    "";            # same path, no redirect
    "~*^/services/?$"                 "/";
    "~*^/datacenter/?$"               "/cloud/";
    "~*^/sme/?$"                      "/enterprise/";
    "~*^/partners/?$"                 "/about/";
    "~*^/iptv/?$"                     "/";           # IPTV is no longer sold
    "~*^/news/?$"                     "/";

    # Shop and plan pages -> plans.
    "~*^/(shop-now|residential-plan|subscription|store)/?$"   "/plans/";
    "~*^/store/(cart|checkout)/?$"                            "/plans/";
    "~*^/store/terms-conditions/?$"                           "/legal/terms/";
    "~*^/product/[^/]+/?$"                                    "/plans/";
    "~*^/product-category/.*$"                                "/plans/";

    # Customer account and self-care -> the self-care portal (stays on its own subdomain).
    "~*^/(self-care|store/account|store/login|my-account)(/.*)?$"  "https://selfcare.nextgen.ng/";

    # Theme demo content (lorem ipsum posts, sample projects, empty categories): gone.
    "~*^/project/.*$"                 "410";
    "~*^/category/.*$"                "410";
    "~*^/tag/.*$"                     "410";
    "~*^/author/.*$"                  "410";
    "~*^/(hello-world|lorem-ipsum-dolor-glavrida-amet|how-to-make-lorem-ipsum-dolor-sit-glavrida|consectetur-adipiscing-elit-sed-do-eiusmod-tempor|dolor-sit-amet-consectetur-adipiscing-elit|tempor-incididunt-ut-labore-et-dolore-magna-aliqua|how-lorem-ipsum-amet-glavrida-dolor|why-amet-lorem-dolor-glavrida-agestas|10-ways-how-to-lorem-ipsum-glavrida-dolor-amet)/?$" "410";
}
