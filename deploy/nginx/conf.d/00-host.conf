# Host-wide settings for 102.213.77.4 (shared by NextGen and NEEP).
# Owner: NextGen session. Installed to /etc/nginx/conf.d/00-host.conf.
# Rules for the shared host: /root/SHARED-HOST.md

# R7: no Nginx version in headers or error pages.
server_tokens off;

# R3: refuse very long request lines and headers.
large_client_header_buffers 4 8k;
client_max_body_size 1m;   # NEEP raises this in its own server block if it needs uploads.

# Slow-client limits.
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;

# R8: an unknown Host name gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/unknown-host.log;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;   # no certificate shown for an unknown name
    access_log /var/log/nginx/unknown-host.log;
}
