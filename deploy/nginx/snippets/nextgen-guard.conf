# NextGen URL guards (server level). Installed to /etc/nginx/snippets/nextgen-guard.conf.
# Maps and off switches: /etc/nginx/conf.d/10-nextgen-maps.conf

# R3: traversal, null byte, double encoding, overlong address.
if ($ng_bad_uri) { return 400; }

# R2 / F5: only GET and HEAD.
error_page 405 = @ng_405;
if ($ng_bad_method) { return 405; }

# R1 / F4 / F18: junk query words and WordPress query tricks get the real 404 page.
if ($ng_bad_query) { return 404; }   # counted in nextgen-junk-query.log (see nextgen.conf)

# ---- R6 / F17: probe paths. $uri is already decoded and normalised; ~* ignores case.
# WordPress words as a path segment at ANY depth (site is not WordPress).
location ~* (^|/)(wp|wp-[^/]*|wordpress|xmlrpc[^/]*|wlwmanifest\.xml)(/|$) {
    if ($ng_guard_probe) { access_log /var/log/nginx/nextgen-probe.log ng_probe; return 404; }
    return 404;
}
# Admin panels, server tools, source folders.
location ~* (^|/)(phpmyadmin|pma|myadmin|adminer[^/]*|cgi-bin|administrator|vendor|node_modules|server-status|server-info|actuator|telescope|_profiler|debug)(/|$) {
    if ($ng_guard_probe) { access_log /var/log/nginx/nextgen-probe.log ng_probe; return 404; }
    return 404;
}
# Hidden files and folders, except /.well-known (certbot needs it).
location ~ /\.(?!well-known/) {
    if ($ng_guard_probe) { access_log /var/log/nginx/nextgen-probe.log ng_probe; return 404; }
    return 404;
}
# Backups, dumps, logs, config and server-side scripts.
location ~* \.(sql|sqlite|db|bak|backup|old|orig|save|swp|tmp|zip|tar|tgz|gz|7z|rar|log|ini|conf|cfg|env|yml|yaml|toml|lock|dist|php[0-9]?|phtml|phar|asp|aspx|jsp|cgi|pl|py|sh)$ {
    if ($ng_guard_probe) { access_log /var/log/nginx/nextgen-probe.log ng_probe; return 404; }
    return 404;
}
# R7: version and licence files.
location ~* (^|/)(readme|changelog|change_log|changes|license|licence|copying|install|upgrade|history)(\.(txt|md|html?))?$ {
    return 404;
}

location @ng_405 {
    include snippets/nextgen-headers.conf;
    add_header Allow "GET, HEAD" always;
    add_header Cache-Control "no-store" always;
    return 405 "Method not allowed\n";
}
