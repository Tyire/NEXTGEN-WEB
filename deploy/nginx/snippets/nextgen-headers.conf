# NextGen security headers. Installed to /etc/nginx/snippets/nextgen-headers.conf.
# Nginx drops server-level add_header lines inside a location that has its own
# add_header, so include this file in EVERY such location.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Static export inlines its boot scripts, so script-src needs 'unsafe-inline'.
# Everything else stays on this origin. Forms use mailto, so form-action allows mailto:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Robots-Tag $ng_robots_header always;   # empty on the real domain, so not sent
